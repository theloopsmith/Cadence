<text x="54" y="699" font-size="12" fill="#9fcdba" font-weight="600">META MODEL API</text>
<text x="54" y="732" font-size="24" fill="#edf2ef" font-weight="600">Photo + speech input</text>
<text x="54" y="768" font-size="15" fill="#b6c1be" font-weight="400">sam-3.1</text>
