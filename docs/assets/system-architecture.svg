<text x="432" y="864" font-size="14" fill="#b6c1be" font-weight="400">SAM searches concepts; accuracy unbenchmarked</text>
<rect x="788" y="668" width="460" height="218" rx="16" fill="#151a19" stroke="#3d5149"/>
<text x="810" y="699" font-size="12" fill="#9fcdba" font-weight="600">REPORTING / CARE CONNECTION</text>
<text x="810" y="732" font-size="24" fill="#edf2ef" font-weight="600">Evidence before claims</text>
<text x="810" y="768" font-size="16" fill="#b6c1be" font-weight="400">Read-only dashboard + phone PDF</text>
<text x="810" y="794" font-size="16" fill="#b6c1be" font-weight="400">Queued ≠ provider accepted ≠ acknowledged</text>
<text x="810" y="830" font-size="14" fill="#b6c1be" font-weight="400">Public demo: caregiver transport simulated</text>
<text x="810" y="856" font-size="14" fill="#b6c1be" font-weight="400">Configured deployments: Twilio + signed callbacks</text>
<text x="32" y="933" font-size="16" fill="#e4c88a" font-weight="400">Public demo excludes research scores, medication-state labels and nutrition advice.</text>
<text x="32" y="965" font-size="14" fill="#b6c1be" font-weight="400">Glasses routes are implemented adapters; exported-photo proofs do not establish live DAT capture or audible output.</text>
<text x="32" y="991" font-size="14" fill="#b6c1be" font-weight="400">Known requests can stay local. Fireworks / Meta Llama 3.3 is a configured alternative when the Baseten key is absent.</text>
