<text x="54" y="504" font-size="24" fill="#edf2ef" font-weight="600">iPhone + mock kit</text>
<text x="54" y="537" font-size="15" fill="#b6c1be" font-weight="400">CoreMotion fallback</text>
<text x="54" y="563" font-size="15" fill="#b6c1be" font-weight="400">Labeled synthetic test streams</text>
<rect x="326" y="140" width="410" height="466" rx="16" fill="#151a19" stroke="#3d5149"/>
<text x="348" y="171" font-size="12" fill="#9fcdba" font-weight="600">SWIFT / SWIFTUI</text>
<text x="348" y="204" font-size="24" fill="#edf2ef" font-weight="600">iPhone app</text>
<text x="348" y="242" font-size="18" fill="#edf2ef" font-weight="600">Companion and guided tasks</text>
<text x="348" y="273" font-size="16" fill="#b6c1be" font-weight="400">Saved facts + explicit confirmations</text>
<text x="348" y="299" font-size="16" fill="#b6c1be" font-weight="400">Motor check, medication and photo review</text>
<text x="348" y="347" font-size="18" fill="#edf2ef" font-weight="600">Immediate assistance</text>
<text x="348" y="378" font-size="16" fill="#b6c1be" font-weight="400">Local motion DSP and walking cues</text>
<text x="348" y="404" font-size="16" fill="#b6c1be" font-weight="400">Deterministic fall check-in / siren</text>
<text x="348" y="430" font-size="16" fill="#b6c1be" font-weight="400">Apple recognition + installed speech voices</text>
