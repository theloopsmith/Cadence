<text x="792" y="407" font-size="16" fill="#b6c1be" font-weight="400">Grounded photo replies + optional transcription</text>
<text x="792" y="433" font-size="16" fill="#b6c1be" font-weight="400">OpenCV writing + optional Muse photo review</text>
<text x="792" y="459" font-size="16" fill="#b6c1be" font-weight="400">Durable fall jobs, leases and signed callbacks</text>
<text x="792" y="507" font-size="18" fill="#edf2ef" font-weight="600">Persistent storage</text>
<text x="792" y="538" font-size="16" fill="#b6c1be" font-weight="400">SQLite · 17 declared tables · patient-scoped</text>
<text x="792" y="564" font-size="16" fill="#b6c1be" font-weight="400">Caddy HTTPS + persistent Google Cloud VM disk</text>
